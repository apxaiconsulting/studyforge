<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StudyForge</title>
<meta name="description" content="Turn your notes into study notes, smart flashcards, mock exams and an AI tutor.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyForge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1926" media="(prefers-color-scheme: dark)">
<script>try { const t = localStorage.getItem('sf_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1b1830;--muted:#6b6880;--line:#e6e3f0;--accent:#6c4cf1;--accent-2:#efeafe;--good:#169c62;--warn:#d48a06;--bad:#d64545;--shadow:0 1px 2px rgba(20,10,60,.06),0 6px 24px rgba(20,10,60,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121019;--card:#1c1926;--ink:#eeecf6;--muted:#9a96ad;--line:#2d2939;--accent:#8f74ff;--accent-2:#2a2342;--good:#37c487;--warn:#f0b03a;--bad:#ff6b6b;--shadow:none}}
:root[data-theme=dark]{--bg:#121019;--card:#1c1926;--ink:#eeecf6;--muted:#9a96ad;--line:#2d2939;--accent:#8f74ff;--accent-2:#2a2342;--good:#37c487;--warn:#f0b03a;--bad:#ff6b6b;--shadow:none}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
/* App-like feel on phones/iPads: no double-tap zoom, no selecting UI text, no tap flash */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* Study content stays selectable so students can copy it */
input,textarea,.notes,.msg{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* iOS zooms into any field with text under 16px — keep fields at 16px so focusing never zooms */
input[type=text],input[type=password],textarea,select{font-size:16px}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo img{width:30px;height:30px;border-radius:8px;display:block}
header .sp{flex:1}
main{max-width:940px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:18px;margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
select{width:auto}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:160px;resize:vertical}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 6px 6px 10px;font-size:14px}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip .muted{font-size:12px;white-space:nowrap}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:6px;font-size:13px}
.chip button:hover{background:var(--line);color:var(--ink)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.set{cursor:pointer;transition:transform .1s;display:flex;gap:14px;align-items:center}
.set:hover{transform:translateY(-2px);border-color:var(--accent)}
.pill{display:inline-block;background:var(--accent-2);color:var(--accent);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.ring{--p:0;flex:none;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring b{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px}
.ring.lg{width:84px;height:84px}.ring.lg b{width:68px;height:68px;font-size:18px}
.week{display:flex;gap:6px;align-items:flex-end;height:44px}
.week div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.notes h1,.notes h2,.notes h3{margin:1.2em 0 .4em}.notes h1{font-size:22px}.notes h2{font-size:18px}.notes h3{font-size:16px}
.notes code{background:var(--bg);padding:1px 5px;border-radius:5px}
.notes{line-height:1.7}.notes>:first-child{margin-top:0}
.notes h1{font-size:24px;letter-spacing:-.02em}
.notes h2{font-size:19px;padding-top:14px;border-top:1px solid var(--line);margin-top:1.6em}
.notes h3{color:var(--accent)}
.notes li{margin:3px 0}.notes strong{color:var(--ink)}
.notes table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px;margin:10px 0}
.notes td,.notes th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}.notes th{background:var(--accent-2)}
.notes blockquote{margin:12px 0;padding:10px 14px;background:var(--accent-2);border-left:4px solid var(--accent);border-radius:8px}
.notes blockquote p{margin:0}
.notes hr{display:none}
.katex{font-size:1.05em}.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.flash{perspective:1200px;height:300px;cursor:pointer;margin:16px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:34px 28px;text-align:center;font-size:20px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);overflow:auto}
.flash .back{transform:rotateY(180deg);font-size:17px;background:var(--accent-2)}
.flash .tag{position:absolute;top:12px;left:16px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.grades .btn{display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.grades .btn small{font-weight:500;color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-2)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.chat{display:flex;flex-direction:column;gap:10px;height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg.ai p:first-child{margin-top:0}.msg.ai p:last-child{margin-bottom:0}
.examq{border-top:1px solid var(--line);padding:18px 0}
.examq:first-child{border-top:0;padding-top:0}
.sticky{position:sticky;top:62px;z-index:4;margin-bottom:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px}
.timer.low{color:var(--bad)}
.topic{display:grid;grid-template-columns:minmax(90px,180px) 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.topic .bar{height:8px}
.fb{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center;padding:44px 20px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.hidden{display:none!important}
label.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px;cursor:pointer}
@media (max-width:560px){h1{font-size:23px}.flash{height:260px}.flash .face{font-size:17px}.topic{grid-template-columns:90px 1fr 40px}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')"><img src="icon.svg" alt="">StudyForge</div>
  <div class="sp"></div>
  <button class="btn sm" id="theme" onclick="cycleTheme()" aria-label="Change theme"></button>
</header>
<main id="app"></main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Markdown with LaTeX math: formulas are pulled out before markdown parsing (so _ and \ survive), rendered by KaTeX, then put back.
function renderMath(tex, display) {
  try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); } catch { return esc(tex); }
}
function md(s) {
  const math = [], keep = (tex, display) => `@@MATH${math.push(renderMath(tex.trim(), display)) - 1}@@`;
  s = String(s || '')
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => keep(t, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => keep(t, false))
    .replace(/(^|[^\\$])\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (_, pre, t) => pre + keep(t, false)); // inline $…$, not "$5 and $10"
  return DOMPurify.sanitize(marked.parse(s)).replace(/@@MATH(\d+)@@/g, (_, i) => math[i]);
}
const MAX_SRC = 150000, DAY = 864e5, NEW_PER_SESSION = 20, MASTER_DAYS = 14;
const letter = p => p >= 90 ? 'A' : p >= 80 ? 'B' : p >= 70 ? 'C' : p >= 60 ? 'D' : 'F';
const dkey = (d = new Date()) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();

// ---------- storage ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } }
};
let sets = store.get('sf_sets', []);
const saveSets = () => store.set('sf_sets', sets) || (alert('Your browser storage is full — delete an old study set to keep saving progress.'), false);
const stats = store.get('sf_stats', { days: {} });
function logStudy(n = 1) { stats.days[dkey()] = (stats.days[dkey()] || 0) + n; store.set('sf_stats', stats); }
function streak() {
  let n = 0; const d = new Date();
  if (!stats.days[dkey(d)]) d.setDate(d.getDate() - 1);
  while (stats.days[dkey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- spaced repetition (SM-2 style) ----------
const isNew = c => !c.srs;
const isDue = c => c.srs && c.srs.due <= Date.now();
function nextIv(c, g) { // g: 1 again, 2 hard, 3 good, 4 easy
  let { reps, ease, interval, lapses } = c.srs || { reps: 0, ease: 2.5, interval: 0, lapses: 0 };
  if (g === 1) return { reps: 0, ease: Math.max(1.3, ease - .2), interval: 0, lapses: lapses + 1 };
  if (reps === 0) interval = [0, 0, 1, 1, 3][g];
  else if (reps === 1) interval = [0, 0, 2, 3, 6][g];
  else interval = Math.max(interval + 1, Math.round(interval * (g === 2 ? 1.2 : g === 3 ? ease : ease * 1.3)));
  return { reps: reps + 1, ease: Math.max(1.3, ease + (g === 2 ? -.15 : g === 4 ? .15 : 0)), interval, lapses };
}
function gradeCard(c, g) {
  const n = nextIv(c, g);
  let due = Date.now() + 10 * 60e3;
  if (n.interval) { const d = new Date(Date.now() + n.interval * DAY); d.setHours(4, 0, 0, 0); due = +d; }
  c.srs = { ...n, due, last: Date.now() };
}
const ivLabel = (c, g) => { const n = nextIv(c, g); return n.interval ? (n.interval >= 30 ? Math.round(n.interval / 30) + 'mo' : n.interval + 'd') : '10m'; };
const cardM = c => Math.min(1, (c.srs?.interval || 0) / MASTER_DAYS);
const mastery = cards => cards.length ? Math.round(cards.reduce((a, c) => a + cardM(c), 0) / cards.length * 100) : 0;
const dueCount = s => s.flashcards.filter(isDue).length + Math.min(NEW_PER_SESSION, s.flashcards.filter(isNew).length);
function readiness(s) {
  const m = mastery(s.flashcards), last = s.exams?.[s.exams.length - 1];
  return last ? Math.round(.5 * m + .5 * last.pct) : null;
}

// ---------- AI (Gemini via the StudyForge Worker, which holds the API key) ----------
// Messages use the {role, content: string | [{type:'text'|'image'}]} shape and are translated to Gemini's format.
const API_URL = 'https://studyforge-api.apx-jqnn.workers.dev'; // Cloudflare Worker (worker.js) that holds the Gemini key
async function ai(messages, system, maxTokens = 8000) {
  if (!API_URL) throw new Error('The AI backend is not set up yet (API_URL is empty).');
  const contents = messages.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: typeof m.content === 'string' ? [{ text: m.content }] : m.content.map(b =>
      b.type === 'image' ? { inline_data: { mime_type: b.source.media_type, data: b.source.data } } : { text: b.text })
  }));
  const generationConfig = { maxOutputTokens: maxTokens + 8192 }; // headroom for the model's thinking tokens
  if (/ONLY (a )?JSON/.test(system)) generationConfig.responseMimeType = 'application/json';
  let r;
  for (let attempt = 0; ; attempt++) { // Gemini returns 503 during demand spikes — retry with backoff
    try {
      r = await fetch(API_URL, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents, generationConfig }) });
    } catch { throw new Error('Could not reach the AI service — check your connection and try again.'); }
    if (r.status !== 503 || attempt >= 3) break;
    await new Promise(ok => setTimeout(ok, 3000 * (attempt + 1)));
  }
  const j = await r.json().catch(() => ({}));
  if (r.status === 429 || r.status === 503) throw new Error('StudyForge is busy right now — wait a minute and try again.');
  if (!r.ok) throw new Error(j.error?.message || 'AI service error ' + r.status);
  const c = j.candidates?.[0];
  const text = (c?.content?.parts || []).filter(p => !p.thought && p.text).map(p => p.text).join('');
  if (!text) throw new Error(c?.finishReason === 'MAX_TOKENS' ? 'Response was cut off — try shorter material.' : 'The AI returned no answer' + (c?.finishReason ? ` (${c.finishReason})` : '') + '. Try again.');
  return text;
}
// The model occasionally misspells a topic name; snap it to the closest real topic so score breakdowns stay clean.
function fixTopic(t, topics) {
  if (!t || !topics.length || topics.includes(t)) return t;
  const grams = x => { x = x.toLowerCase(); const g = new Set(); for (let i = 0; i < x.length - 2; i++) g.add(x.slice(i, i + 3)); return g; };
  const a = grams(t); let best = t, score = 0;
  for (const c of topics) { const b = grams(c), sh = [...a].filter(x => b.has(x)).length / Math.max(a.size, b.size, 1); if (sh > score) { score = sh; best = c; } }
  return score >= .4 ? best : t;
}
function parseJSON(t) {
  try { return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)); }
  catch { throw new Error('The AI’s answer came back incomplete — please try again (very long material can cause this).'); }
}

const OUTLINE_SYSTEM = `You outline study material. Respond with ONLY JSON: {"title": string (short, descriptive), "topics": [string]}.
"topics" = the main topics of the material in reading order: between 3 and 12 (more for longer material), each 2-5 words and clearly distinct.`;
const CARDS_SYSTEM = `You write flashcards from study material. Respond with ONLY JSON: {"flashcards":[{"front": string, "back": string, "topic": one of the given topics}]}.
Together your cards must cover EVERY term, definition, fact, date, person, formula, process step and key idea in your assigned part, spread evenly across it — one idea per card, no duplicates. Fronts are a question or a term; every back must directly and correctly answer its front — concise but complete.
Base cards on the material. If the material is too short for this many cards, add cards on closely related, standard knowledge that deepens understanding of it — never pad with vague, trivial or repeated cards.`;
const QUIZ_SYSTEM = `You write multiple-choice practice questions from study material. Respond with ONLY JSON: {"quiz":[{"question": string, "options": [4 strings], "answer": index 0-3, "explanation": string, "topic": one of the given topics}]}.
Spread the questions across ALL the content in your assigned part so every important point gets tested. Mix recall, understanding and application; make distractors plausible; vary which option is correct; no duplicates.
Base questions on the material. If the material is too short for this many questions, add questions on closely related, standard knowledge — never pad with trivial or repeated questions.`;

// Large amounts are split into parallel batches, each owning a contiguous share of the topics, so they stay fast and don't overlap.
function planBatches(topics, total, perBatch) {
  const n = Math.max(1, Math.ceil(total / perBatch));
  const parts = topics.length >= 2 ? Math.min(n, topics.length) : n, counts = [];
  for (let i = 0; i < parts; i++) counts.push(Math.floor(total / parts) + (i < total % parts ? 1 : 0));
  if (topics.length < 2) return counts.map((count, i) => ({ count, focus: parts > 1 ? `Cover part ${i + 1} of ${parts} of the material (split it into ${parts} equal parts in reading order) — other parts are handled separately.` : 'Cover the whole material.' }));
  return counts.map((count, i) => {
    const group = topics.slice(Math.floor(i * topics.length / parts), Math.floor((i + 1) * topics.length / parts));
    return { count, focus: parts > 1 ? `Cover ONLY these topics — the others are handled separately: ${JSON.stringify(group)}.` : 'Cover all the topics.' };
  });
}
async function runBatches({ system, key, text, topics, total, perBatch, tokensPerItem, extra = '' }) {
  const results = await Promise.allSettled(planBatches(topics, total, perBatch).map(b =>
    ai([{ role: 'user', content: `<material>\n${text}\n</material>\n\nTopics: ${JSON.stringify(topics)}\n${b.focus}\nWrite exactly ${b.count} items.${extra}` }],
      system, Math.min(30000, 2000 + b.count * tokensPerItem)).then(t => parseJSON(t)[key] || [])));
  const ok = results.filter(r => r.status === 'fulfilled');
  if (!ok.length) throw results[0].reason;
  return ok.flatMap(r => r.value);
}
const dedupe = (arr, key) => { const seen = new Set(); return arr.filter(x => { const k = norm(key(x)); return k && !seen.has(k) && seen.add(k); }); };

// How many cards/questions to make: "auto" scales with the material so everything is covered.
const COUNT_OPTS = { cards: ['auto', 25, 50, 100, 150], quiz: ['auto', 10, 25, 50, 100] };
const countPrefs = () => ({ cards: 'auto', quiz: 'auto', ...store.get('sf_counts', {}) });
function resolveCounts(text) {
  const words = text.split(/\s+/).length, p = countPrefs(), clamp = (v, a, b) => Math.min(b, Math.max(a, Math.round(v)));
  return { cards: p.cards === 'auto' ? clamp(words / 8, 15, 150) : +p.cards, quiz: p.quiz === 'auto' ? clamp(words / 14, 10, 100) : +p.quiz };
}

// Notes get their own request: bundled into the JSON call above, the model squeezed them to a short summary.
const NOTES_SYSTEM = `You are an expert tutor writing comprehensive, exam-ready study notes from a student's material. Output ONLY the notes in Markdown (no preamble, no closing remarks).

Be thorough — these notes should let a student learn the topic without rereading the source:
- Cover EVERY concept, term, process, date, formula, person, example and argument in the material. Never skip or merge distinct points.
- Explain each idea in depth in your own words, then expand it with accurate background knowledge: context, causes and effects, how it works step by step, significance or "why it matters", connections to other ideas, and examples. Short material must be expanded substantially — teach the topic, don't just restate the source.
- Organise logically: "# <title>", an "## Overview" (a full paragraph), then one "##" section per major topic, each with several "###" subsections and multiple paragraphs. Follow the material's order unless another order is clearly easier to learn.
- Use bullet points and short paragraphs; **bold** every key term the first time it appears, followed by its definition.
- Use tables for comparisons, classifications, timelines or step-by-step processes; numbered lists for sequences.
- Add worked examples or real-world examples where they help (from the material, or clearly simple illustrations of it).
- Include, where useful: "> 💡 **Tip:**" memory aids or mnemonics, and "> ⚠️ **Common mistake:**" callouts for easily confused ideas.
- Write formulas and equations in LaTeX: $...$ inline, $$...$$ on their own line (e.g. $$6CO_2 + 6H_2O \\rightarrow C_6H_{12}O_6 + 6O_2$$). Use LaTeX only for real formulas — write words, abbreviations (ATP, DNA), units (kg, m/s², N) and plain numbers as normal text; inside formulas wrap units in \\text{}, e.g. $F = 8\\,\\text{N}$.
- Only add a mnemonic if it is genuinely memorable — skip weak ones.
- After the topic sections, add "## Key terms" (a two-column table: Term | Meaning) and "## Key takeaways" (5-10 bullets).
- End with "## Comprehensive review": a detailed summary of the ENTIRE material that a student could reread the night before an exam instead of the full notes.
  - One "###" per major topic, in order. Under each, a substantial paragraph (or a paragraph plus tight bullets) recapping every key fact, definition, formula, date, cause/effect and example from that topic — condensed, but nothing important left out.
  - Then "### The big picture": a paragraph explaining how the topics connect and why the subject matters.
  - Make it roughly a third as long as the notes above it, and never under 500 words.
LENGTH IS IMPORTANT. The notes (not counting the comprehensive review) must be long and detailed: at least 1,500 words even for a single short paragraph of source material, 2,500-4,000 words for a page or two, and 4,000-7,000 words for a full chapter or lecture. Never cut a section short to save space; when in doubt, explain more.
Everything must be accurate and consistent with the material; background you add should be standard, well-established knowledge for the subject.`;

const TRANSCRIBE_SYSTEM = `You transcribe study material from images (photos of notes, handwriting, whiteboards, textbook or slide pages, scanned documents). Output the full text faithfully in reading order as plain markdown. Preserve headings, lists, equations (as plain text) and tables. Briefly describe any diagram in [Diagram: ...]. Mark unreadable words as [illegible]. Output only the transcription.`;

// ---------- file & image reading ----------
function toJpegB64(src, w, h) {
  const k = Math.min(1, 1568 / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .85).split(',')[1];
}
async function imageFileToB64(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  await new Promise((ok, bad) => { img.onload = ok; img.onerror = () => bad(new Error('Unsupported image format')); img.src = url; });
  URL.revokeObjectURL(url);
  return toJpegB64(img, img.naturalWidth, img.naturalHeight);
}
async function transcribe(images, label) {
  let out = '';
  for (let i = 0; i < images.length; i += 5) {
    setStatus(`Reading ${label} with AI vision (${Math.min(i + 5, images.length)}/${images.length})…`);
    const content = images.slice(i, i + 5).map(data => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } }));
    content.push({ type: 'text', text: 'Transcribe these pages in order.' });
    out += await ai([{ role: 'user', content }], TRANSCRIBE_SYSTEM, 8000) + '\n\n';
  }
  return out;
}
const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|html?|rtf|srt|vtt)$/i;
async function readFile(file) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (/\.(heic|heif)$/i.test(file.name)) throw new Error('HEIC photos aren’t supported by browsers — set your camera to “Most Compatible” or export as JPG');
  if (!isPdf && !file.type.startsWith('image/') && !file.type.startsWith('text/') && !TEXT_EXT.test(file.name))
    throw new Error('unsupported file type — use a PDF, a photo, or a text file (for Word or PowerPoint, save as PDF first)');
  if (file.size > 40 * 1024 * 1024) throw new Error('file is larger than 40 MB');
  if (file.type.startsWith('image/')) return transcribe([await imageFileToB64(file)], file.name);
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    setStatus(`Extracting text from ${file.name}…`);
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise.catch(e => {
      throw new Error(e?.name === 'PasswordException' ? 'this PDF is password-protected — remove the password and try again' : 'this PDF looks damaged or unreadable');
    });
    let out = '';
    for (let i = 1; i <= pdf.numPages && out.length < MAX_SRC; i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      out += c.items.map(x => x.str).join(' ') + '\n\n';
    }
    if (out.replace(/\s/g, '').length >= 40 * Math.min(pdf.numPages, 20)) return out;
    // Scanned PDF: render pages and read them with vision
    const imgs = [], pages = Math.min(pdf.numPages, 20);
    for (let i = 1; i <= pages; i++) {
      setStatus(`Scanned PDF detected — rendering page ${i}/${pages}…`);
      const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.6 }), cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      imgs.push(toJpegB64(cv, cv.width, cv.height));
    }
    return (await transcribe(imgs, file.name)) + (pdf.numPages > 20 ? '\n\n[Only the first 20 scanned pages were read.]' : '');
  }
  return file.text();
}

async function generate() {

  if (text.length < 80) { draft.err = 'Add a bit more material (at least a paragraph).'; return render(); }
  const n = resolveCounts(text);
  draft.busy = `Writing notes, ${n.cards} flashcards and ${n.quiz} questions…`; draft.err = ''; render();
  try {
    // Notes start right away; the outline (title + topics) comes first so card and quiz batches can split the topics.
    // If only the notes or the quiz fail, the set is still saved.
    const notesP = makeNotes(text).then(v => ({ v }), e => ({ e }));
    const outline = parseJSON(await ai([{ role: 'user', content: `<material>\n${text}\n</material>\n\nOutline it.` }], OUTLINE_SYSTEM, 2000));
    const topics = (outline.topics || []).filter(t => typeof t === 'string' && t.trim());
    const [cardsRes, quizRes] = await Promise.allSettled([
      runBatches({ system: CARDS_SYSTEM, key: 'flashcards', text, topics, total: n.cards, perBatch: 50, tokensPerItem: 160 }),
      runBatches({ system: QUIZ_SYSTEM, key: 'quiz', text, topics, total: n.quiz, perBatch: 30, tokensPerItem: 320 })

    if (cardsRes.status === 'rejected' && quizRes.status === 'rejected') throw cardsRes.reason;
    const notes = await notesP;
    const s = { id: Date.now().toString(36), created: Date.now(), source: text, title: outline.title || 'Untitled', topics,
      summary: notes.v || '',
      flashcards: dedupe((cardsRes.value || []).filter(c => c.front && c.back), c => c.front).map(c => ({ ...c, topic: fixTopic(c.topic, topics) })),
      quiz: dedupe((quizRes.value || []).map(q => ({ ...q, answer: +q.answer, topic: fixTopic(q.topic, topics) })).filter(q => q.question && q.options?.length === 4 && q.answer >= 0 && q.answer < 4), q => q.question),

    if (notes.e) s.notesErr = 'Notes didn’t finish: ' + notes.e.message;
    if (!s.flashcards.length && !s.quiz.length) throw new Error('The AI response was incomplete — please try again.');
    sets.unshift(s);
    if (!store.set('sf_sets', sets)) { sets.shift(); throw new Error('Your browser storage is full — delete an old study set, then try again.'); }

    go('set', { id: s.id, tab: 'notes' });

}

let rv = null;
function startReview(list, { title, cram = false, topics = null, back = { name: 'home' } } = {}) {
  const items = []; let fresh = 0;
  for (const s of list) s.flashcards.forEach((c, i) => {
    if (topics && !topics.includes(c.topic)) return;
    if (cram || isDue(c)) items.push({ sid: s.id, i });
    else if (isNew(c) && fresh < NEW_PER_SESSION) { items.push({ sid: s.id, i }); fresh++; }
  });
  if (cram) items.sort(() => Math.random() - .5);
  rv = { items, pos: 0, flip: false, cram, title, back, done: 0 };
  go('review');
}
function reviewView(app) {
  if (!rv) return go('home');
  const back = `<button class="btn sm" onclick="go('${rv.back.name}',${esc(JSON.stringify(rv.back))})">← Exit</button>`;
  if (rv.pos >= rv.items.length) {
    rv.keys = null;
    app.innerHTML = `${back}<div class="card center" style="margin-top:14px"><div style="font-size:44px">🎉</div>
      <h2>Session complete</h2><p class="muted">${rv.done} cards reviewed · 🔥 ${streak()} day streak</p>
      ${rv.cram ? '' : '<p class="muted small">Cards you found hard will come back sooner. See you at your next review.</p>'}
      <button class="btn primary" onclick="go('${rv.back.name}',${esc(JSON.stringify(rv.back))})">Done</button></div>`;
    return;
  }
  const it = rv.items[rv.pos], s = sets.find(x => x.id === it.sid), c = s.flashcards[it.i];
  app.innerHTML = `
    <div class="row between">${back}<span class="muted small">${esc(rv.title)} · ${rv.items.length - rv.pos} left${isNew(c) && !rv.cram ? ' · <span class="pill">NEW</span>' : ''}</span></div>
    <div class="bar" style="margin-top:12px"><i style="width:${rv.pos / rv.items.length * 100}%"></i></div>
    <div class="flash ${rv.flip ? 'flip' : ''}" id="card"><div class="in">
      <div class="face"><span class="tag">${esc(c.topic || 'TERM').toUpperCase()}</span><div>${esc(c.front)}</div></div>
      <div class="face back"><span class="tag">ANSWER</span><div>${esc(c.back)}</div></div></div></div>
    <div id="actions"></div>
    <p class="muted small" style="text-align:center">Space to flip · ${rv.cram ? '1 missed · 2 got it' : '1 Again · 2 Hard · 3 Good · 4 Easy'}</p>`;
  const actions = () => {
    $('#actions').innerHTML = !rv.flip ? `<div class="row" style="justify-content:center"><button class="btn primary" id="show">Show answer</button></div>`
      : rv.cram ? `<div class="row" style="justify-content:center"><button class="btn" data-g="1" style="color:var(--bad)">✗ Missed</button><button class="btn" data-g="3" style="color:var(--good)">✓ Got it</button></div>`
      : `<div class="grades">${[['Again', 'var(--bad)'], ['Hard', 'var(--warn)'], ['Good', 'var(--good)'], ['Easy', 'var(--accent)']].map(([l, col], i) =>
          `<button class="btn" data-g="${i + 1}"><span style="color:${col}">${l}</span><small>${ivLabel(c, i + 1)}</small></button>`).join('')}</div>`;
    if ($('#show')) $('#show').onclick = flip;
    document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => answer(+b.dataset.g));
  };
  const flip = () => { rv.flip = !rv.flip; $('#card').classList.toggle('flip', rv.flip); actions(); };
  const answer = g => {
    if (!rv.cram) gradeCard(c, g);
    if (g === 1) rv.items.push(it); else rv.done++;
    if (!rv.cram || g !== 1) logStudy(1);
    saveSets(); rv.pos++; rv.flip = false; render();
  };
  $('#card').onclick = flip;
  rv.keys = e => {
    if (e.key === ' ') { e.preventDefault(); flip(); }
    else if (rv.flip && /^[1-4]$/.test(e.key)) { const g = +e.key; if (!rv.cram) answer(g); else if (g <= 2) answer(g === 1 ? 1 : 3); }
  };
  actions();
}
document.addEventListener('keydown', e => {
  if (view.name === 'review' && rv?.keys && !/INPUT|TEXTAREA/.test(e.target.tagName)) rv.keys(e);
});

// ---------- quiz ----------
let qz = null;
function quizTab(s, el) {
  if (!s.quiz.length) { el.innerHTML = '<div class="card center muted">This set has no practice quiz — try a mock exam in the 🎓 Exam tab.</div>'; return; }
  if (!qz || qz.id !== s.id) qz = { id: s.id, i: 0, picked: null, score: 0 };
  const draw = () => {
    if (qz.i >= s.quiz.length) {
      const pct = Math.round(qz.score / s.quiz.length * 100);
      if (!qz.logged) { qz.logged = 1; logStudy(s.quiz.length); if (s.best == null || pct > s.best) { s.best = pct; saveSets(); } }
      el.innerHTML = `<div class="card center">
        <div style="font-size:44px;font-weight:800;color:var(--accent)">${pct}%</div>
        <h2>${qz.score} of ${s.quiz.length} correct</h2>
        <p class="muted">${pct >= 90 ? 'Outstanding — you’ve got this material down.' : pct >= 70 ? 'Solid! Review the flashcards for the ones you missed.' : 'Keep going — reread the notes and try again.'}</p>
        <button class="btn primary" id="retake">Retake quiz</button></div>`;
      $('#retake').onclick = () => { qz = null; quizTab(s, el); };
      return;
    }
    const q = s.quiz[qz.i], done = qz.picked != null;
    el.innerHTML = `
      <div class="row between"><span class="muted">Question ${qz.i + 1} of ${s.quiz.length}</span><span class="pill">Score ${qz.score}</span></div>
      <div class="bar" style="margin:8px 0 16px"><i style="width:${qz.i / s.quiz.length * 100}%"></i></div>
      <div class="card"><h2 style="font-size:17px">${esc(q.question)}</h2>
        ${q.options.map((o, i) => `<button class="opt ${done ? (i === q.answer ? 'right' : i === qz.picked ? 'wrong' : '') : ''}" data-i="${i}" ${done ? 'disabled' : ''}>
          <b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}
        ${done ? `<div class="fb"><b>${qz.picked === q.answer ? '✓ Correct' : '✗ Not quite'}</b> — ${esc(q.explanation)}</div>
          <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="next">${qz.i + 1 < s.quiz.length ? 'Next →' : 'See results'}</button></div>` : ''}
      </div>`;
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => { qz.picked = +b.dataset.i; if (qz.picked === q.answer) qz.score++; draw(); });
    if (done) $('#next').onclick = () => { qz.i++; qz.picked = null; draw(); };
  };
  draw();
}

// ---------- exam simulator ----------
let ex = null;
const EXAM_SYSTEM = `You write rigorous mock exams from study material. Respond with ONLY JSON:
{"questions":[{"type":"mcq"|"tf"|"fill"|"short",
  "question": string (for "fill", include a blank written as _____),
  "options": [4 strings] (mcq only),
  "answer": number 0-3 (mcq) | true/false (tf) | string: the exact missing word/phrase (fill) | string: a complete model answer (short),
  "rubric": string (short only: the key points needed for full credit),
  "points": number (mcq/tf/fill: 1, short: 3-5),
  "topic": one of the given topics}]}
Test understanding and application, not just recall. Mix difficulties and spread questions across all the content in your assigned part; no duplicates.`;
const GRADE_SYSTEM = `You are a fair, rigorous examiner. Grade each student answer against the model answer and rubric. Award partial credit where deserved (any number from 0 to the max points, halves allowed). For fill-in-the-blank, accept synonyms and minor spelling errors. Respond with ONLY JSON:
{"grades":[{"id": number, "earned": number, "feedback": string (1-2 specific sentences: what was right, what was missing)}],
 "advice": string (3-4 sentences of personalised study advice based on this student's mistakes)}`;
const norm = t => String(t ?? '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const fmtT = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const ansText = (q, a) => a == null || a === '' ? '—' : q.type === 'mcq' ? q.options[a] : q.type === 'tf' ? (a ? 'True' : 'False') : a;
const keyText = q => q.type === 'mcq' ? q.options[q.answer] : q.type === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;

setInterval(() => {
  if (ex?.phase !== 'taking' || !ex.endAt) return;
  const left = ex.endAt - Date.now(), t = $('#timer');
  if (t) { t.textContent = fmtT(left); t.classList.toggle('low', left < 60e3); }
  if (left <= 0) submitExam(true);
}, 500);

function examTab(s, el) {
  if (ex && ex.sid !== s.id && ['taking', 'generating', 'grading'].includes(ex.phase) && sets.some(x => x.id === ex.sid)) {
    const other = sets.find(x => x.id === ex.sid);
    el.innerHTML = `<div class="card center"><h2>You have an exam in progress</h2><p class="muted">“${esc(other.title)}” — finish it first, or discard it to start one here.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="resume">Back to that exam</button><button class="btn" id="discard">Discard it</button></div></div>`;
    $('#resume').onclick = () => go('set', { id: other.id, tab: 'exam' });
    $('#discard').onclick = () => { ex = null; examTab(s, el); };
    return;
  }
  if (!ex || ex.sid !== s.id) ex = { sid: s.id, phase: 'setup', n: 25, mins: 30, types: { mcq: true, tf: true, fill: true, short: true } };
  if (ex.phase === 'setup') {
    el.innerHTML = `<div class="card" style="margin-bottom:14px">
      <h2>Mock exam</h2>
      <p class="muted" style="margin-top:-6px">A fresh, timed exam with mixed question types. Written answers are graded by AI against a rubric, with partial credit and feedback.</p>
      <div class="row" style="gap:18px;margin:14px 0">
        <label>Questions <select id="n">${[10, 25, 50, 75, 100].map(v => `<option ${v === ex.n ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label>Time limit <select id="mins">${[0, 15, 30, 45, 60, 90, 120, 180].map(v => `<option value="${v}" ${v === ex.mins ? 'selected' : ''}>${v ? (v >= 90 ? v / 60 + ' hours' : v + ' min') : 'Untimed'}</option>`).join('')}</select></label>
      </div>
      <div style="margin-bottom:16px">${[['mcq', 'Multiple choice'], ['tf', 'True / false'], ['fill', 'Fill in the blank'], ['short', 'Short answer']].map(([k, l]) =>
        `<label class="chk"><input type="checkbox" data-t="${k}" ${ex.types[k] ? 'checked' : ''}> ${l}</label>`).join('')}</div>
      <button class="btn primary" id="start">🎓 Generate exam</button>
      ${ex.err ? `<div class="err">${esc(ex.err)}</div>` : ''}
    </div>
    ${s.exams?.length ? `<div class="card"><h2>Past exams</h2>${s.exams.slice().reverse().map(x =>
      `<div class="row between examq"><span>${new Date(x.date).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><b>${x.pct}% · ${letter(x.pct)}</b></div>`).join('')}</div>` : ''}`;
    $('#n').onchange = e => ex.n = +e.target.value;
    $('#mins').onchange = e => ex.mins = +e.target.value;
    el.querySelectorAll('[data-t]').forEach(b => b.onchange = () => ex.types[b.dataset.t] = b.checked);
    $('#start').onclick = () => makeExam(s);
    return;
  }
  if (ex.phase === 'generating' || ex.phase === 'grading') {
    el.innerHTML = `<div class="card center"><span class="spin" style="width:30px;height:30px"></span><h2 style="margin-top:14px">${ex.phase === 'generating' ? 'Writing your exam…' : 'Grading your answers…'}</h2><p class="muted">${ex.phase === 'generating' ? `Creating ${ex.n} fresh questions from your material${ex.n > 25 ? ' — big exams take up to a minute' : ''}.` : 'Checking written answers against the rubric.'}</p></div>`;
    return;
  }
  if (ex.phase === 'taking') {
    const answered = () => ex.answers.filter(a => a != null && a !== '').length;
    el.innerHTML = `
    <div class="card sticky row between" style="padding:12px 16px">
      <span>${ex.endAt ? `⏱ <span class="timer" id="timer">${fmtT(ex.endAt - Date.now())}</span>` : '<b>Untimed</b>'}</span>
      <span class="muted small" id="answered">${answered()} / ${ex.qs.length} answered</span>
      <button class="btn primary" id="submit">Submit exam</button>
    </div>
    <div class="card">${ex.qs.map((q, i) => `<div class="examq">
      <div class="row between"><span class="muted small">Question ${i + 1} · ${q.points} pt${q.points > 1 ? 's' : ''}</span>${q.topic ? `<span class="pill">${esc(q.topic)}</span>` : ''}</div>
      <h2 style="font-size:16px;margin:6px 0 8px">${esc(q.question)}</h2>
      ${q.type === 'mcq' ? q.options.map((o, j) => `<button class="opt ${ex.answers[i] === j ? 'sel' : ''}" data-q="${i}" data-v="${j}"><b>${'ABCD'[j]}.</b> ${esc(o)}</button>`).join('')
        : q.type === 'tf' ? `<div class="row">${[true, false].map(v => `<button class="opt ${ex.answers[i] === v ? 'sel' : ''}" style="width:auto;min-width:110px;text-align:center" data-q="${i}" data-v="${v}">${v ? 'True' : 'False'}</button>`).join('')}</div>`
        : q.type === 'fill' ? `<input type="text" data-q="${i}" value="${esc(ex.answers[i] || '')}" placeholder="Your answer">`
        : `<textarea data-q="${i}" style="min-height:110px" placeholder="Write your answer…">${esc(ex.answers[i] || '')}</textarea>`}
    </div>`).join('')}</div>`;
    el.querySelectorAll('button.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.q; ex.answers[i] = ex.qs[i].type === 'tf' ? b.dataset.v === 'true' : +b.dataset.v;
      el.querySelectorAll(`button.opt[data-q="${i}"]`).forEach(x => x.classList.toggle('sel', x === b));
      $('#answered').textContent = `${answered()} / ${ex.qs.length} answered`;
    });
    el.querySelectorAll('input[data-q],textarea[data-q]').forEach(f => f.oninput = () => { ex.answers[+f.dataset.q] = f.value; $('#answered').textContent = `${answered()} / ${ex.qs.length} answered`; });
    $('#submit').onclick = () => { const left = ex.qs.length - answered(); if (!left || confirm(`${left} question(s) unanswered. Submit anyway?`)) submitExam(); };
    return;
  }
  // results
  const r = ex.result, topics = Object.entries(r.byTopic), weak = topics.filter(([, v]) => v.e / v.p < .7).map(([t]) => t);
  const drillable = weak.length && s.flashcards.some(c => weak.includes(c.topic));
  el.innerHTML = `
  <div class="card row" style="gap:24px;margin-bottom:14px">
    <div class="ring lg" style="--p:${r.pct}"><b>${letter(r.pct)}</b></div>
    <div style="flex:1;min-width:200px"><div style="font-size:26px;font-weight:800">${r.pct}%</div>
      <div class="muted">${r.earned} / ${r.total} points · ${fmtT(r.ms)} used${r.timedOut ? ' · ⏱ time ran out' : ''}</div></div>
    <div class="row"><button class="btn" id="again">New exam</button>${drillable ? `<button class="btn primary" id="drill">Drill weak topics</button>` : ''}</div>
  </div>
  ${r.advice ? `<div class="card" style="margin-bottom:14px;background:var(--accent-2);border-color:transparent"><b>📋 Your study plan</b><div style="margin-top:6px">${esc(r.advice)}</div></div>` : ''}
  ${topics.length ? `<div class="card" style="margin-bottom:14px"><h2>Score by topic</h2>${topics.map(([t, v]) => { const p = Math.round(v.e / v.p * 100); return `
    <div class="topic"><span>${esc(t)}</span><div class="bar"><i style="width:${p}%;background:${p >= 70 ? 'var(--good)' : p >= 50 ? 'var(--warn)' : 'var(--bad)'}"></i></div><span class="muted">${p}%</span></div>`; }).join('')}</div>` : ''}
  <div class="card"><h2>Review answers</h2>${ex.qs.map((q, i) => { const g = r.items[i], full = g.earned >= q.points, zero = !g.earned; return `
    <div class="examq">
      <div class="row between"><span class="muted small">Question ${i + 1}</span><b style="color:${full ? 'var(--good)' : zero ? 'var(--bad)' : 'var(--warn)'}">${g.earned} / ${q.points}</b></div>
      <div style="font-weight:600;margin:4px 0">${esc(q.question)}</div>
      <div class="small"><span class="muted">Your answer:</span> ${esc(ansText(q, ex.answers[i]))}</div>
      ${full && q.type !== 'short' ? '' : `<div class="small"><span class="muted">${q.type === 'short' ? 'Model answer' : 'Correct answer'}:</span> ${esc(keyText(q))}</div>`}
      ${g.feedback ? `<div class="fb">${esc(g.feedback)}</div>` : ''}
    </div>`; }).join('')}</div>`;
  $('#again').onclick = () => { ex = { ...ex, phase: 'setup', result: null, err: '' }; examTab(s, el); };
  if (drillable) $('#drill').onclick = () => startReview([s], { title: 'Weak topics', cram: true, topics: weak, back: { name: 'set', id: s.id, tab: 'exam' } });
}
async function makeExam(s) {
  const types = Object.keys(ex.types).filter(k => ex.types[k]);
  if (!types.length) { ex.err = 'Pick at least one question type.'; return render(); }
  ex.phase = 'generating'; ex.err = ''; render();
  try {
    const raw = await runBatches({ system: EXAM_SYSTEM, key: 'questions', text: s.source, topics: s.topics || [], total: ex.n, perBatch: 25, tokensPerItem: 380,
      extra: `\nUse only these question types, mixed: ${types.join(', ')}.\nDon't repeat these practice-quiz questions: ${JSON.stringify(s.quiz.map(q => q.question).slice(0, 150))}` });
    const order = { mcq: 0, tf: 1, fill: 2, short: 3 };
    const qs = dedupe(raw, q => q.question).sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9)).map(q => ({ ...q, topic: fixTopic(q.topic, s.topics || []), points: Math.max(1, +q.points || 1), answer: q.type === 'tf' ? q.answer === true || q.answer === 'true' : q.type === 'mcq' ? +q.answer : q.answer }))
      .filter(q => types.includes(q.type) && q.question && (q.type !== 'mcq' || (q.options?.length === 4 && q.answer >= 0 && q.answer < 4)));
    if (!qs.length) throw new Error('The exam came back empty — try again.');
    Object.assign(ex, { qs, answers: qs.map(() => null), phase: 'taking', startAt: Date.now(), endAt: ex.mins ? Date.now() + ex.mins * 60e3 : null });
  } catch (e) { ex.phase = 'setup'; ex.err = e.message; }
  if (view.tab === 'exam') render();
}
async function submitExam(timedOut = false) {
  if (ex?.phase !== 'taking') return;
  const s = sets.find(x => x.id === ex.sid), ms = Date.now() - ex.startAt;
  ex.phase = 'grading'; if (view.name === 'set' && view.tab === 'exam') render();
  const items = ex.qs.map((q, i) => {
    const a = ex.answers[i];
    if (a == null || a === '') return { earned: 0, feedback: 'No answer given.' };
    if (q.type === 'mcq' || q.type === 'tf') return { earned: a === q.answer ? q.points : 0, feedback: '' };
    if (q.type === 'fill' && norm(a) === norm(q.answer)) return { earned: q.points, feedback: '' };
    return null; // needs AI grading
  });
  let advice = '';
  const toGrade = ex.qs.map((q, i) => items[i] ? null : { id: i, type: q.type, question: q.question, max_points: q.points, model_answer: q.answer, rubric: q.rubric || '', student_answer: ex.answers[i] }).filter(Boolean);
  const mistakes = ex.qs.map((q, i) => items[i] && items[i].earned < q.points ? { question: q.question, topic: q.topic, student: ansText(q, ex.answers[i]), correct: keyText(q) } : null).filter(Boolean);
  if (toGrade.length || mistakes.length) try {
    const out = parseJSON(await ai([{ role: 'user', content: `Answers to grade:\n${JSON.stringify(toGrade)}\n\nOther questions the student got wrong (already graded, use for advice):\n${JSON.stringify(mistakes)}` }], GRADE_SYSTEM, 14000));
    for (const g of out.grades || []) if (toGrade.some(t => t.id === g.id)) items[g.id] = { earned: Math.min(ex.qs[g.id].points, Math.max(0, +g.earned || 0)), feedback: g.feedback || '' };
    advice = out.advice || '';
  } catch (e) { advice = toGrade.length ? 'AI grading failed (' + e.message + '). Written answers were scored 0 — compare them to the model answers below.' : ''; }
  items.forEach((it, i) => { if (!it) items[i] = { earned: 0, feedback: 'Could not be graded.' }; });
  const byTopic = {};
  ex.qs.forEach((q, i) => { const t = q.topic || 'General'; byTopic[t] ??= { e: 0, p: 0 }; byTopic[t].e += items[i].earned; byTopic[t].p += q.points; });
  const earned = items.reduce((a, x) => a + x.earned, 0), total = ex.qs.reduce((a, q) => a + q.points, 0), pct = Math.round(earned / total * 100);
  ex.result = { items, earned, total, pct, byTopic, advice, ms, timedOut };
  ex.phase = 'results';
  s.exams = [...(s.exams || []), { date: Date.now(), pct }]; saveSets(); logStudy(ex.qs.length);
  if (view.name === 'set' && view.id === s.id) render();
}

// ---------- tutor ----------
const tutorBusy = new Set(); // set ids with a tutor reply in flight
function tutorTab(s, el) {
  const draw = () => {
    el.innerHTML = `<div class="card">
      <div class="chat" id="chat">
        <div class="msg ai">Hi! I’m your tutor for <b>${esc(s.title)}</b>. Ask me to explain a concept, give an example, or quiz you.</div>
        ${s.chat.map(m => `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${m.role === 'user' ? esc(m.content) : md(stripCites(m.content))}</div>`).join('')}
        ${tutorBusy.has(s.id) ? '<div class="msg ai"><span class="spin"></span></div>' : ''}
      </div>
      <div class="row" style="margin:10px 0 8px">${['Explain the hardest concept simply', 'Give me a real-world example', 'Quiz me with 3 open questions', 'What should I memorize?']
        .map(p => `<button class="btn sm sug">${p}</button>`).join('')}</div>
      <form class="row" id="ask" style="flex-wrap:nowrap"><input type="text" id="q" placeholder="Ask anything about this material…" autocomplete="off">
        <button class="btn primary" ${tutorBusy.has(s.id) ? 'disabled' : ''}>Send</button></form>
      ${s.chat.length ? '<button class="btn sm" id="clr" style="margin-top:8px">Clear chat</button>' : ''}</div>`;
    const c = $('#chat'); c.scrollTop = c.scrollHeight;
    $('#ask').onsubmit = e => { e.preventDefault(); send($('#q').value); };
    el.querySelectorAll('.sug').forEach(b => b.onclick = () => send(b.textContent));
    if ($('#clr')) $('#clr').onclick = () => { s.chat = []; saveSets(); draw(); };
    if (matchMedia('(hover: hover)').matches) $('#q').focus(); // skip on phones so the keyboard doesn't pop up
  };
  const send = async text => {
    text = text.trim(); if (!text || tutorBusy.has(s.id)) return;
    s.chat.push({ role: 'user', content: text }); tutorBusy.add(s.id); draw();
    try {
      const reply = await ai(s.chat.slice(-20), `You are a friendly, encouraging tutor helping a student learn the material below. Explain clearly, use examples, check understanding, and keep answers focused. Use markdown.
If something isn't in the material, you may answer from general knowledge but say so.\n\n<material>\n${s.source}\n</material>`, 2000);
      s.chat.push({ role: 'assistant', content: reply });
    } catch (e) { s.chat.pop(); alert(e.message); }
    tutorBusy.delete(s.id); saveSets(); if (view.name === 'set' && view.tab === 'tutor' && view.id === s.id) draw();
  };
  draw();
}

render();
</script>
</body>
</html>
